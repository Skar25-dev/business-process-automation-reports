<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Configuración - {{ app_name }}</title>
        <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nuestro CSS compartido -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">📊 BPAR SYSTEM</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/">Dashboard</a>
                    <a class="nav-link active" href="/settings">Configuración</a>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 mb-5">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white p-3">
                            ⚙️ AJUSTES DEL SISTEMA
                        </div>
                        <div class="card-body p-4">
                            <form action="/settings" method="post">
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Nombre de la Aplicación</label>
                                        <input type="text" name="app_name" class="form-control" value="{{ settings.app_name }}" required>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Nombre de la Empresa</label>
                                        <input type="text" name="company_name" class="form-control" value="{{ settings.company_name }}" required>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">Email de Destino (Reportes)</label>
                                    <input type="email" name="contact_email" class="form-control" value="{{ settings.contact_email }}" required>
                                    <div class="form-text">Dirección donde se enviarán los archivos Excel generados.</div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Hora del Reporte Diario</label>
                                        <input type="time" name="report_schedule" class="form-control" value="{{ settings.report_schedule }}" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Motor de Base de Datos</label>
                                        <select name="db_type" class="form-select">
                                            <option value="sqlite" {% if settings.db_type == 'sqlite' %}selected{% endif %}>SQLite (Local)</option>
                                            <option value="postgresql" {% if settings.db_type == 'postgresql' %}selected{% endif %}>PostgreSQL (Producción)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="alert alert-info mt-3 small">
                                    💡 Al guardar los cambios, el servidor se reiniciará automáticamente para aplicar la nueva configuración y reprogramar el Scheduler.
                                </div>
        
                                <hr class="my-4">
                                <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">
                                    💾 Guardar y Aplicar Cambios
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
